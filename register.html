<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - CardNMR Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper input { width: 100%; padding-right: 45px !important; }
        .password-toggle {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #a0aec0; cursor: pointer; font-size: 1.1rem; padding: 5px;
            transition: color 0.3s;
        }
        .password-toggle:hover { color: #ffffff; }
        .password-hidden { filter: blur(4px); transition: filter 0.3s ease; }
        .password-visible { filter: blur(0px); transition: filter 0.3s ease; }
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px rgba(0,0,0,0.3) inset !important;
            -webkit-text-fill-color: #ffffff !important;
            caret-color: #ffffff !important;
            background-color: rgba(0,0,0,0.3) !important;
            background-clip: content-box !important;
        }
        input { background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(255,255,255,0.1) !important; border-radius: 10px !important; color: #ffffff !important; padding: 12px 15px !important; width: 100%; font-size: 1rem; transition: all 0.3s; }
        input:focus { outline: none; border-color: #4f46e5 !important; box-shadow: 0 0 0 3px rgba(79,70,229,0.2) !important; }
    </style>
</head>
<body>
    <div style="max-width:450px; margin:0 auto; padding:60px 20px; min-height:100vh; display:flex; align-items:center; justify-content:center;">
        <div style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:40px; width:100%;">
            <div style="text-align:center; margin-bottom:30px;">
                <i class="fas fa-user-plus fa-3x" style="color:#4f46e5;"></i>
                <h2 style="color:white; font-size:1.8rem; font-weight:700; margin-top:10px;">Crear Cuenta</h2>
                <p style="color:#a0aec0;">Únete a CardNMR Store</p>
            </div>
            <form id="registerForm">
                <div style="margin-bottom:20px;">
                    <label style="color:#a0aec0; font-size:0.9rem; display:block; margin-bottom:5px;">Nombre de Usuario</label>
                    <input type="text" id="registerUsername" placeholder="juanperez" required>
                </div>
                <div style="margin-bottom:20px;">
                    <label style="color:#a0aec0; font-size:0.9rem; display:block; margin-bottom:5px;">Email</label>
                    <input type="email" id="registerEmail" placeholder="tu@email.com" required>
                </div>
                <div style="margin-bottom:20px;">
                    <label style="color:#a0aec0; font-size:0.9rem; display:block; margin-bottom:5px;">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="registerPassword" placeholder="••••••••" required class="password-hidden">
                        <button type="button" class="password-toggle" id="togglePassword"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn-primary btn-block" style="width:100%; padding:14px; font-size:1rem;">Registrarse</button>
                <div style="text-align:center; margin-top:20px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1);">
                    <p style="color:#a0aec0;">¿Ya tienes cuenta? <a href="login.html" style="color:#818cf8; font-weight:600;">Inicia Sesión</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('registerPassword');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function() {
                const isHidden = passwordInput.classList.contains('password-hidden');
                if (isHidden) {
                    passwordInput.type = 'text';
                    passwordInput.classList.remove('password-hidden');
                    passwordInput.classList.add('password-visible');
                    this.innerHTML = '<i class="fas fa-eye-slash"></i>';
                } else {
                    passwordInput.type = 'password';
                    passwordInput.classList.remove('password-visible');
                    passwordInput.classList.add('password-hidden');
                    this.innerHTML = '<i class="fas fa-eye"></i>';
                }
            });
        }
    });
    </script>

</body>
</html>
