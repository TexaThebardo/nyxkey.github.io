<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - CardNMR Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html">
                    <i class="fas fa-credit-card"></i>
                    CardNMR Store
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="shop.html">Tienda</a>
                <a href="cart.html" id="cartBtn">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cartCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <section class="auth-page">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <i class="fas fa-user-plus fa-3x"></i>
                        <h2>Crear Cuenta</h2>
                        <p>Únete a CardNMR Store</p>
                    </div>
                    <form id="registerForm" class="auth-form">
                        <div class="form-group">
                            <label for="registerFullName">Nombre Completo</label>
                            <input type="text" id="registerFullName" placeholder="Juan Pérez" required>
                        </div>
                        <div class="form-group">
                            <label for="registerUsername">Nombre de Usuario</label>
                            <input type="text" id="registerUsername" placeholder="juanperez" required>
                        </div>
                        <div class="form-group">
                            <label for="registerEmail">Email</label>
                            <input type="email" id="registerEmail" placeholder="tu@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="registerPassword">Contraseña</label>
                            <input type="password" id="registerPassword" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn-primary btn-block">Registrarse</button>
                        <div class="auth-footer">
                            <p>¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>CardNMR Store</h3>
                    <p>Tienda de tarjetas premium desde 2024</p>
                </div>
                <div class="footer-section">
                    <h4>Enlaces</h4>
                    <a href="shop.html">Tienda</a>
                    <a href="#">Política de Privacidad</a>
                    <a href="#">Términos</a>
                </div>
                <div class="footer-section">
                    <h4>Contacto</h4>
                    <p><i class="fas fa-envelope"></i> info@cardnmr.com</p>
                    <div class="social-links">
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-telegram"></i></a>
                        <a href="#"><i class="fab fa-github"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 CardNMR Store - Todos los derechos reservados</p>
            </div>
        </div>
    </footer>

    <!-- ============================================= -->
    <!-- SCRIPTS - ORDEN CORRECTO -->
    <!-- ============================================= -->
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
