<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Tienda de Tarjetas</title>
    <!-- Agrega esto para los iconos de las tarjetas y el menú -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. BARRA LATERAL IZQUIERDA (NUEVO) -->
    <div class="sidebar">
        <div class="logo"><i class="fa-solid fa-credit-card"></i> CardStore</div>
        <ul class="menu">
            <li class="active"><a href="#"><i class="fa-solid fa-store"></i> Tienda</a></li>
            <li><a href="#"><i class="fa-solid fa-coins"></i> Agregar Saldo</a></li>
            <li><a href="#"><i class="fa-solid fa-arrow-right-arrow-left"></i> Transacciones</a></li>
            <li><a href="checkout.html"><i class="fa-solid fa-cart-shopping"></i> Carrito</a></li>
            <li><a href="#"><i class="fa-solid fa-star"></i> Destacados</a></li>
        </ul>
    </div>

    <!-- 2. CONTENEDOR PRINCIPAL -->
    <div class="main-content">
        
        <!-- TOPBAR (NUEVO) -->
        <header class="topbar">
            <div class="search-area">
                <input type="text" id="search-input" placeholder="Buscar tarjetas...">
            </div>
            <div class="user-area">
                <div class="balance-box">
                    <span>Saldo disponible</span>
                    <!-- El saldo se actualizará con tu JS -->
                    <strong id="topbar-balance">$0.00</strong>
                </div>
                <div class="profile-box">
                    <i class="fa-solid fa-user-circle"></i>
                    <span>Mi Perfil</span>
                </div>
            </div>
        </header>

        <!-- 3. CONTENIDO DE LA TIENDA -->
        <div class="content-body">
            
            <!-- ESTADÍSTICAS -->
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Total Productos</h3>
                    <p id="total-products-count">0</p>
                </div>
                <div class="stat-card">
                    <h3>Productos Destacados</h3>
                    <p id="featured-products-count">0</p>
                </div>
            </div>

            <!-- FILTROS DE CATEGORÍA -->
            <div class="category-filters">
                <button class="cat-btn active" data-cat="all">Todos</button>
                <button class="cat-btn" data-cat="Visa">Visa</button>
                <button class="cat-btn" data-cat="Mastercard">Mastercard</button>
                <button class="cat-btn" data-cat="Amex">Amex</button>
            </div>

            <!-- 4. LA TABLA DE TARJETAS (Reemplaza tu lista de productos anterior) -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Network</th>
                            <th>BIN</th>
                            <th>Database</th>
                            <th>Class</th>
                            <th>Level</th>
                            <th>Bank</th>
                            <th>Country</th>
                            <th>Type</th>
                            <th>Non VBV</th>
                            <th>Non MSC</th>
                            <th>Precio</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="products-table-body">
                        <!-- Tu JS cargará las filas aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 5. EL SCRIPT DE TU TIENDA -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Cargar los productos desde el JSON
            fetch('product.json')
                .then(response => response.json())
                .then(products => {
                    renderProducts(products); // Renderizar la tabla
                    setupFilters(products);    // Configurar los botones de filtro
                    setupSearch(products);     // Configurar la barra de búsqueda
                })
                .catch(error => console.error('Error cargando productos:', error));


            // FUNCIÓN PARA RENDERIZAR LA TABLA
            function renderProducts(data) {
                const tbody = document.getElementById('products-table-body');
                tbody.innerHTML = '';

                // Actualizar contadores
                document.getElementById('total-products-count').innerText = data.length;
                document.getElementById('featured-products-count').innerText = data.filter(p => p.featured === true).length;
                
                // Actualizar saldo (puedes cambiarlo por el saldo real de tu usuario)
                const totalSaldo = data.reduce((acc, p) => acc + p.price, 0);
                document.getElementById('topbar-balance').innerText = `$${totalSaldo.toFixed(2)}`;

                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="12" style="text-align:center; padding:40px; color:#8b949e;">No hay tarjetas en esta categoría.</td></tr>`;
                    return;
                }

                // Crear fila por cada tarjeta
                data.forEach(product => {
                    // Clases para el logo de la tarjeta
                    let networkClass = 'badge-network ';
                    if(product.network.toLowerCase() === 'visa') networkClass += 'badge-visa';
                    else if(product.network.toLowerCase() === 'mastercard') networkClass += 'badge-mastercard';
                    else if(product.network.toLowerCase() === 'amex') networkClass += 'badge-amex';

                    // Bandera del país
                    const flags = {
                        'UNITED STATES': '🇺🇸', 'DOMINICAN REPUBLIC': '🇩🇴', 'MEXICO': '🇲🇽',
                        'AUSTRALIA': '🇦🇺', 'CANADA': '🇨🇦'
                    };
                    const flag = flags[product.country] || '🌍';

                    const row = `
                        <tr>
                            <td><span class="${networkClass}"><i class="fa-brands fa-cc-${product.network.toLowerCase()}"></i> ${product.network}</span></td>
                            <td><strong>${product.bin}</strong></td>
                            <td><span class="badge-type">${product.database}</span></td>
                            <td>${product.class}</td>
                            <td>${product.level}</td>
                            <td>${product.bank}</td>
                            <td><span class="badge-country">${flag} ${product.country}</span></td>
                            <td><span class="badge-type">${product.type}</span></td>
                            <td>${product.nonVbv ? '<span class="badge-nonvbv">Non VBV</span>' : '-'}</td>
                            <td>${product.nonMsc ? '<span class="badge-nonvbv">Non MSC</span>' : '-'}</td>
                            <td><span class="price-text">$${product.price.toFixed(2)}</span></td>
                            <td><button class="btn-add-cart" onclick="addToCart(${product.id})"><i class="fa-solid fa-cart-plus"></i></button></td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            }

            // LÓGICA DE FILTROS
            function setupFilters(products) {
                const filterBtns = document.querySelectorAll('.cat-btn');
                filterBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        filterBtns.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');

                        const category = this.getAttribute('data-cat');
                        if(category === 'all') renderProducts(products);
                        else renderProducts(products.filter(p => p.network.toLowerCase() === category.toLowerCase()));
                    });
                });
            }

            // LÓGICA DE BÚSQUEDA
            function setupSearch(products) {
                const searchInput = document.getElementById('search-input');
                searchInput.addEventListener('input', function() {
                    const term = this.value.toLowerCase();
                    if(term === '') {
                        const activeCat = document.querySelector('.cat-btn.active').getAttribute('data-cat');
                        if(activeCat === 'all') renderProducts(products);
                        else renderProducts(products.filter(p => p.network.toLowerCase() === activeCat.toLowerCase()));
                    } else {
                        const searched = products.filter(p => 
                            p.bank.toLowerCase().includes(term) || 
                            p.bin.includes(term) ||
                            p.country.toLowerCase().includes(term)
                        );
                        renderProducts(searched);
                    }
                });
            }

            // AGREGAR AL CARRITO (Usando tu sistema de localStorage)
            window.addToCart = function(id) {
                fetch('product.json')
                .then(res => res.json())
                .then(products => {
                    const product = products.find(p => p.id === id);
                    let cart = JSON.parse(localStorage.getItem('myCart')) || [];
                    
                    if(cart.find(item => item.id === id)) {
                        alert('¡Esta tarjeta ya está en el carrito!');
                        return;
                    }
                    cart.push(product);
                    localStorage.setItem('myCart', JSON.stringify(cart));
                    alert(`✅ ${product.network} agregada al carrito!`);
                });
            };
        });
    </script>
</body>
</html>
