<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Manager Dashboard</title>
    <!-- Cargamos la librería de iconos FontAwesome para que los iconos funcionen -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ESTILOS CSS COMPLETOS INTEGRADOS -->
    <style>
        /* --- RESET Y FUENTES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; background-color: #0d1117; color: #c9d1d9; height: 100vh; overflow: hidden; }

        /* --- BARRA LATERAL IZQUIERDA (SIDEBAR) --- */
        .sidebar { width: 260px; height: 100%; background-color: #161b22; padding: 20px 15px; border-right: 1px solid #30363d; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar .logo { font-size: 1.4rem; font-weight: bold; color: #58a6ff; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .sidebar .menu { list-style: none; display: flex; flex-direction: column; gap: 5px; }
        .sidebar .menu li a { display: flex; align-items: center; gap: 15px; text-decoration: none; color: #8b949e; padding: 12px 15px; border-radius: 8px; transition: all 0.2s ease; font-size: 0.95rem; }
        .sidebar .menu li a:hover { background-color: #21262d; color: #f0f6fc; }
        .sidebar .menu li.active a { background-color: #21262d; color: #58a6ff; border-left: 3px solid #58a6ff; }
        .sidebar .menu li a i { width: 20px; text-align: center; font-size: 1.1rem; }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* --- TOPBAR (SALDO Y PERFIL) --- */
        .topbar { height: 70px; background-color: #161b22; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; border-bottom: 1px solid #30363d; flex-shrink: 0; }
        .search-area input { background: #0d1117; border: 1px solid #30363d; padding: 10px 15px; border-radius: 6px; color: #c9d1d9; width: 300px; outline: none; transition: border 0.2s; }
        .search-area input:focus { border-color: #58a6ff; }
        .user-area { display: flex; align-items: center; gap: 20px; }
        .balance-box { background: #21262d; padding: 8px 20px; border-radius: 20px; display: flex; gap: 10px; align-items: center; font-size: 0.9rem; border: 1px solid #30363d; }
        .balance-box strong { color: #2ea043; font-size: 1.1rem; }
        .profile-box { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 5px 10px; border-radius: 8px; transition: 0.2s; }
        .profile-box:hover { background: #21262d; }
        .profile-box i { font-size: 1.8rem; color: #8b949e; }

        /* --- CONTENIDO DEL CUERPO (SCROLLABLE) --- */
        .content-body { padding: 25px 30px; overflow-y: auto; height: 100%; }

        /* --- ESTADÍSTICAS --- */
        .stats-container { display: flex; gap: 20px; margin-bottom: 25px; }
        .stat-card { background: #161b22; padding: 18px 25px; border-radius: 10px; border: 1px solid #30363d; min-width: 180px; }
        .stat-card h3 { font-size: 0.85rem; color: #8b949e; font-weight: 400; }
        .stat-card p { font-size: 1.8rem; font-weight: bold; margin-top: 5px; color: #58a6ff; }

        /* --- FILTROS --- */
        .category-filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .cat-btn { background: transparent; border: 1px solid #30363d; color: #8b949e; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; }
        .cat-btn:hover { background: #21262d; color: #f0f6fc; border-color: #8b949e; }
        .cat-btn.active { background: #1f6feb; color: white; border-color: #1f6feb; }

        /* --- TABLA ESTILO DASHBOARD --- */
        .table-container { background: #161b22; border-radius: 12px; border: 1px solid #30363d; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 1000px; }
        thead { background: #0d1117; }
        thead th { text-align: left; padding: 18px 15px; color: #8b949e; border-bottom: 2px solid #30363d; white-space: nowrap; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
        tbody td { padding: 14px 15px; border-bottom: 1px solid #21262d; vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background-color: #0d1117; }

        /* --- ESTILOS DE BADGES Y ETIQUETAS --- */
        .badge-network { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; }
        .badge-visa { background: #1a2332; color: #ffffff; border: 1px solid #1434cb; }
        .badge-mastercard { background: #1a1a1a; color: #ffffff; border: 1px solid #f79e1b; }
        .badge-amex { background: #1a2332; color: #ffffff; border: 1px solid #1081c4; }
        .badge-country { display: flex; align-items: center; gap: 6px; }
        .badge-type { background: #21262d; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; border: 1px solid #30363d; display: inline-block; }
        .badge-nonvbv { color: #f0883e; font-weight: bold; background: rgba(240, 136, 62, 0.1); padding: 3px 8px; border-radius: 4px; border: 1px solid #f0883e; font-size: 0.75rem; white-space: nowrap; }
        
        /* PRECIO Y BOTÓN */
        .price-text { color: #2ea043; font-weight: bold; font-size: 0.95rem; }
        .btn-add-cart { background: #238636; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-add-cart:hover { background: #2ea043; transform: scale(1.05); }

        /* SCROLLBAR PERSONALIZADA */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }
    </style>
</head>
<body>

    <!-- BARRA LATERAL -->
    <div class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-credit-card"></i> CardStore
        </div>
        <ul class="menu">
            <li class="active"><a href="#"><i class="fa-solid fa-store"></i> Tienda</a></li>
            <li><a href="#"><i class="fa-solid fa-coins"></i> Agregar Saldo</a></li>
            <li><a href="#"><i class="fa-solid fa-arrow-right-arrow-left"></i> Transacciones</a></li>
            <li><a href="#" id="go-to-cart-btn"><i class="fa-solid fa-cart-shopping"></i> Carrito</a></li>
            <li><a href="#"><i class="fa-solid fa-star"></i> Destacados</a></li>
        </ul>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="main-content">
        
        <!-- TOPBAR -->
        <header class="topbar">
            <div class="search-area">
                <input type="text" id="search-input" placeholder="Buscar tarjetas...">
            </div>
            <div class="user-area">
                <div class="balance-box">
                    <span>Saldo disponible</span>
                    <strong id="topbar-balance">$0.00</strong>
                </div>
                <div class="profile-box">
                    <i class="fa-solid fa-user-circle"></i>
                    <span>Mi Perfil</span>
                </div>
            </div>
        </header>

        <!-- CONTENIDO DINÁMICO -->
        <div class="content-body">
            
            <!-- CONTADORES -->
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Total Productos</h3>
                    <p id="total-products-count">0</p>
                </div>
                <div class="stat-card">
                    <h3>Productos Destacados</h3>
                    <p id="featured-products-count">0</p>
                </div>
            </div>

            <!-- FILTROS -->
            <div class="category-filters">
                <button class="cat-btn active" data-cat="all">Todos</button>
                <button class="cat-btn" data-cat="Visa">Visa</button>
                <button class="cat-btn" data-cat="Mastercard">Mastercard</button>
                <button class="cat-btn" data-cat="Amex">Amex</button>
            </div>

            <!-- TABLA -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Network</th>
                            <th>BIN</th>
                            <th>Database</th>
                            <th>Class</th>
                            <th>Level</th>
                            <th>Bank</th>
                            <th>Country</th>
                            <th>Type</th>
                            <th>Uso / Servicio</th>
                            <th>Non VBV</th>
                            <th>Non MSC</th>
                            <th>Extra</th>
                            <th>Precio</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="products-table-body">
                        <!-- Las tarjetas se cargarán aquí con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT COMPLETO -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. BASE DE DATOS DE PRODUCTOS (Ejemplo basado en tu imagen)
            // Puedes cambiar esto por una petición fetch() o un JSON.parse de localStorage
            let products = [
                { id: 1, network: 'Visa', bin: '414720', database: 'DB_July_2026', class: 'CREDIT', level: 'PLATINUM', bank: 'JPMORGAN CHASE', country: 'UNITED STATES', type: 'CC Full', service: 'Multifunctional', nonVbv: true, price: 28.58, featured: true },
                { id: 2, network: 'Mastercard', bin: '521894', database: 'DB_July_2026', class: 'CREDIT', level: 'TITANIUM', bank: 'CAPITAL ONE BANK', country: 'UNITED STATES', type: 'Non VBV', service: 'Non-VBV', nonVbv: true, price: 48.58, featured: false },
                { id: 3, network: 'Visa', bin: '471612', database: 'DB_July_2026', class: 'DEBIT', level: 'SIGNATURE', bank: 'BANK OF AMERICA', country: 'UNITED STATES', type: 'CC Full', service: 'Multifunctional', nonVbv: false, price: 27.90, featured: true },
                { id: 4, network: 'Amex', bin: '371449', database: 'DB_July_2026', class: 'CREDIT', level: 'CENTURION', bank: 'AMERICAN EXPRESS', country: 'UNITED STATES', type: 'Non VBV', service: 'Non-VBV', nonVbv: true, price: 51.29, featured: true },
                { id: 5, network: 'Visa', bin: '469566', database: 'DB_July_2026', class: 'CREDIT', level: 'PURCHASING', bank: 'BANCO POPULAR', country: 'DOMINICAN REPUBLIC', type: 'Non VBV', service: 'Non-VBV', nonVbv: true, price: 36.29, featured: false },
                { id: 6, network: 'Mastercard', bin: '546871', database: 'DB_July_2026', class: 'CREDIT', level: 'WORLD', bank: 'BANCOMER, S.A.', country: 'MEXICO', type: 'CC Full', service: 'Multifunctional', nonVbv: false, price: 28.66, featured: false },
                { id: 7, network: 'Visa', bin: '438857', database: 'DB_July_2026', class: 'CREDIT', level: 'PREMIER', bank: 'WELLS FARGO BANK', country: 'UNITED STATES', type: 'CC Full', service: 'Wells Fargo', nonVbv: false, price: 29.50, featured: false },
                { id: 8, network: 'Mastercard', bin: '516329', database: 'DB_July_2026', class: 'CREDIT', level: 'MIXED', bank: 'WESTPAC BANKING', country: 'AUSTRALIA', type: 'Non VBV', service: 'Non-VBV', nonVbv: true, price: 32.00, featured: true },
                { id: 9, network: 'Visa', bin: '481523', database: 'DB_July_2026', class: 'DEBIT', level: 'CLASSIC', bank: 'BANCO SANTA CRUZ', country: 'DOMINICAN REPUBLIC', type: 'Non VBV', service: 'Non-VBV', nonVbv: true, price: 48.58, featured: false },
                { id: 10, network: 'Discover', bin: '601100', database: 'DB_July_2026', class: 'CREDIT', level: 'GOLD', bank: 'DISCOVER BANK', country: 'UNITED STATES', type: 'CC Full', service: 'Multifunctional', nonVbv: false, price: 26.80, featured: true }
            ];

            // 2. FUNCIÓN PRINCIPAL PARA RENDERIZAR LA TABLA
            function renderProducts(data) {
                const tbody = document.getElementById('products-table-body');
                tbody.innerHTML = '';

                // Actualizar contadores y saldo del topbar
                document.getElementById('total-products-count').innerText = data.length;
                document.getElementById('featured-products-count').innerText = data.filter(p => p.featured).length;
                
                // Calculamos el saldo total (puedes cambiarlo por el saldo real de tu usuario)
                const totalSaldo = data.reduce((acc, p) => acc + p.price, 0);
                document.getElementById('topbar-balance').innerText = `$${totalSaldo.toFixed(2)}`;

                // Si no hay datos, mostramos un mensaje
                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="14" style="text-align:center; padding:40px; color:#8b949e;">No hay tarjetas disponibles en esta categoría.</td></tr>`;
                    return;
                }

                // Recorremos los productos para crear las filas
                data.forEach(product => {
                    // Determinar clase de CSS para la red (Visa, Mastercard, etc.)
                    let networkClass = 'badge-network ';
                    let networkIcon = '';
                    if(product.network.toLowerCase() === 'visa') { networkClass += 'badge-visa'; networkIcon = 'fa-brands fa-cc-visa'; }
                    else if(product.network.toLowerCase() === 'mastercard') { networkClass += 'badge-mastercard'; networkIcon = 'fa-brands fa-cc-mastercard'; }
                    else if(product.network.toLowerCase() === 'amex') { networkClass += 'badge-amex'; networkIcon = 'fa-brands fa-cc-amex'; }
                    else { networkIcon = 'fa-solid fa-credit-card'; }

                    // Mapa de banderas (Emojis)
                    const countryFlags = {
                        'UNITED STATES': '🇺🇸', 'DOMINICAN REPUBLIC': '🇩🇴', 'MEXICO': '🇲🇽',
                        'AUSTRALIA': '🇦🇺', 'CANADA': '🇨🇦'
                    };
                    const flag = countryFlags[product.country] || '🌍';

                    // Estructura HTML de la fila
                    const row = `
                        <tr>
                            <td><span class="${networkClass}"><i class="${networkIcon}"></i> ${product.network}</span></td>
                            <td><strong>${product.bin}</strong></td>
                            <td><span class="badge-type">${product.database}</span></td>
                            <td>${product.class}</td>
                            <td>${product.level}</td>
                            <td>${product.bank}</td>
                            <td><span class="badge-country">${flag} ${product.country}</span></td>
                            <td><span class="badge-type">${product.type}</span></td>
                            <td>${product.service || '-'}</td>
                            <td>${product.nonVbv ? '<span class="badge-nonvbv">Non VBV</span>' : '-'}</td>
                            <td>${product.nonVbv ? '<span class="badge-nonvbv">Non MSC</span>' : '-'}</td>
                            <td>${product.extra || '-'}</td>
                            <td><span class="price-text">$${product.price.toFixed(2)}</span></td>
                            <td><button class="btn-add-cart" onclick="addToCart(${product.id}, '${product.network}', ${product.price})"><i class="fa-solid fa-cart-plus"></i></button></td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            }

            // 3. LÓGICA DE FILTROS (Por red / categoría)
            const filterBtns = document.querySelectorAll('.cat-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    const category = this.getAttribute('data-cat');
                    if(category === 'all') {
                        renderProducts(products);
                    } else {
                        const filtered = products.filter(p => p.network.toLowerCase() === category.toLowerCase());
                        renderProducts(filtered);
                    }
                });
            });

            // 4. LÓGICA DE BÚSQUEDA (Por nombre del banco o BIN)
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                if(searchTerm === '') {
                    // Si está vacío, volvemos al filtro activo actual (o todos)
                    const activeCat = document.querySelector('.cat-btn.active').getAttribute('data-cat');
                    if(activeCat === 'all') renderProducts(products);
                    else renderProducts(products.filter(p => p.network.toLowerCase() === activeCat.toLowerCase()));
                } else {
                    const searched = products.filter(p => 
                        p.bank.toLowerCase().includes(searchTerm) || 
                        p.bin.includes(searchTerm) ||
                        p.country.toLowerCase().includes(searchTerm)
                    );
                    renderProducts(searched);
                }
            });

            // 5. FUNCIÓN PARA AGREGAR AL CARRITO (Guardar en LocalStorage)
            window.addToCart = function(id, network, price) {
                // Obtenemos el carrito actual
                let cart = JSON.parse(localStorage.getItem('myCart')) || [];
                
                // Verificamos si ya está en el carrito
                const existing = cart.find(item => item.id === id);
                if(existing) {
                    alert('¡Esta tarjeta ya está en tu carrito!');
                    return;
                }

                // Buscamos el producto completo en nuestro array
                const productToAdd = products.find(p => p.id === id);
                
                // Lo agregamos al array del carrito
                cart.push(productToAdd);
                
                // Guardamos de vuelta en localStorage
                localStorage.setItem('myCart', JSON.stringify(cart));
                
                // Feedback visual
                alert(`✅ ¡${network} (BIN: ${productToAdd.bin}) agregada al carrito!`);
                
                // Opcional: Actualizar un contador en el sidebar si quisieras
            };

            // 6. BOTÓN DE IR AL CARRITO
            document.getElementById('go-to-cart-btn').addEventListener('click', function(e) {
                e.preventDefault();
                // Guardamos una bandera para que sepa que debe mostrar un loading al llegar
                localStorage.setItem('showLoading', 'true');
                // Redirigimos a la página del carrito (asumimos que se llama checkout.html)
                window.location.href = 'checkout.html';
            });

            // 7. RENDERIZADO INICIAL
            // Para que solo se vean los "Destacados" al inicio, descomenta la siguiente línea y comenta la de abajo:
            // const initialProducts = products.filter(p => p.featured === true);
            // renderProducts(initialProducts);
            
            // Renderizamos todos los productos al inicio
            renderProducts(products);
        });
    </script>
</body>
</html>
