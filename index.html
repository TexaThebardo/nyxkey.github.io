<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Manager Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Iconos (FontAwesome para los íconos de la barra lateral) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- BARRA LATERAL IZQUIERDA (Sidebar) -->
    <div class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-credit-card"></i> CardStore
        </div>
        <ul class="menu">
            <li class="active"><a href="#"><i class="fa-solid fa-store"></i> Tienda</a></li>
            <li><a href="#"><i class="fa-solid fa-coins"></i> Agregar Saldo</a></li>
            <li><a href="#"><i class="fa-solid fa-arrow-right-arrow-left"></i> Transacciones</a></li>
            <li><a href="#"><i class="fa-solid fa-cart-shopping"></i> Carrito</a></li>
            <li><a href="#"><i class="fa-solid fa-star"></i> Destacados</a></li>
        </ul>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="main-content">
        
        <!-- TOPBAR (Saldo y Perfil) -->
        <header class="topbar">
            <div class="search-area">
                <input type="text" placeholder="Buscar tarjetas...">
            </div>
            <div class="user-area">
                <div class="balance-box">
                    <span>Saldo disponible</span>
                    <strong id="topbar-balance">$0.00</strong>
                </div>
                <div class="profile-box">
                    <i class="fa-solid fa-user-circle"></i>
                    <span>Mi Perfil</span>
                </div>
            </div>
        </header>

        <!-- CONTENIDO DINÁMICO -->
        <div class="content-body">
            
            <!-- CONTADOR DE PRODUCTOS -->
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Total Productos</h3>
                    <p id="total-products-count">0</p>
                </div>
                <div class="stat-card">
                    <h3>Productos Destacados</h3>
                    <p id="featured-products-count">0</p>
                </div>
            </div>

            <!-- FILTROS DE CATEGORÍA -->
            <div class="category-filters">
                <button class="cat-btn active" data-cat="all">Todos</button>
                <button class="cat-btn" data-cat="Visa">Visa</button>
                <button class="cat-btn" data-cat="Mastercard">Mastercard</button>
                <button class="cat-btn" data-cat="Amex">Amex</button>
            </div>

            <!-- TABLA DE TARJETAS (Estilo Imagen) -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Network</th>
                            <th>BIN</th>
                            <th>Database</th>
                            <th>Class</th>
                            <th>Level</th>
                            <th>Bank</th>
                            <th>Country</th>
                            <th>Type</th>
                            <th>Uso / Servicio</th>
                            <th>Non VBV</th>
                            <th>Non MSC</th>
                            <th>Extra</th>
                            <th>Precio</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="products-table-body">
                        <!-- Las tarjetas se cargarán aquí con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
