<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - CardNMR Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html">
                    <i class="fas fa-credit-card"></i>
                    CardNMR Store
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="shop.html">Tienda</a>
                <a href="#" id="cartBtn">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cartCount">0</span>
                </a>
                <div id="authButtons">
                    <a href="login.html" class="btn-login">Iniciar Sesión</a>
                    <a href="register.html" class="btn-register">Registrarse</a>
                </div>
                <div id="userMenu" style="display:none;">
                    <span id="userName"></span>
                    <a href="profile.html"><i class="fas fa-user"></i></a>
                    <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <section class="profile-page">
        <div class="container">
            <div class="profile-container">
                <div class="profile-sidebar">
                    <div class="profile-avatar">
                        <i class="fas fa-user-circle fa-5x"></i>
                        <h3 id="profileName">Usuario</h3>
                        <p id="profileEmail">email@ejemplo.com</p>
                    </div>
                    <div class="profile-menu">
                        <a href="#" class="active" data-section="orders">Mis Pedidos</a>
                        <a href="#" data-section="settings">Configuración</a>
                    </div>
                </div>
                <div class="profile-content">
                    <div id="profileSection">
                        <!-- Se carga desde JS -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
