<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Yx Cards</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .profile-insignias-container {
            margin-top: 12px;
        }
        .profile-insignias-container label {
            font-size: 12px;
            color: #5a6575;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 6px;
        }
        .profile-insignias-container .user-insignias {
            justify-content: flex-start;
            gap: 6px;
        }
        .profile-insignias-container .insignia-badge {
            font-size: 13px;
            padding: 4px 16px;
            border-radius: 20px;
        }
        .profile-insignias-container .insignia-badge .material-icons {
            font-size: 18px;
        }
        .admin-tools-container {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #1e2630;
            display: none;
        }
        .admin-tools-container .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .admin-tools-container .btn-group .btn-primary,
        .admin-tools-container .btn-group .btn-secondary {
            width: auto;
            padding: 10px 24px;
            font-size: 14px;
        }
        .btn-admin-link {
            display: none;
            align-items: center;
            gap: 4px;
            background: rgba(240, 185, 11, 0.15);
            border: 1px solid rgba(240, 185, 11, 0.3);
            color: #f0b90b;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            margin-left: 8px;
        }
        .btn-admin-link:hover {
            background: rgba(240, 185, 11, 0.25);
            border-color: #f0b90b;
            transform: scale(1.05);
        }
        .btn-admin-link .material-icons {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="material-icons-outlined">flash_on</span>
                <span class="logo-text">Yx</span>
                <span class="logo-text-full">Cards</span>
            </div>
            <div class="nav-user">
                <!-- BOTÓN ADMIN MANAGER (solo visible para admins) -->
                <button id="adminPanelBtn" class="btn-admin-link" onclick="window.location.href='admin.html'" style="display:none;">
                    <span class="material-icons">admin_panel_settings</span>
                    Admin
                </button>
                
                <div class="user-balance">
                    <span class="material-icons-outlined">account_balance_wallet</span>
                    <span class="balance-amount" id="userBalance">$0.00</span>
                </div>
                <div class="user-avatar">
                    <span class="material-icons-outlined">person</span>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="dashboard-container">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <span class="sidebar-title">Navegación</span>
                <a href="dashboard.html" class="sidebar-link">
                    <span class="material-icons-outlined">dashboard</span>
                    <span>Dashboard</span>
                </a>
                <a href="profile.html" class="sidebar-link active">
                    <span class="material-icons-outlined">person</span>
                    <span>Mi Perfil</span>
                </a>
                <a href="index.html" class="sidebar-link">
                    <span class="material-icons-outlined">storefront</span>
                    <span>Tienda</span>
                </a>
                
                <!-- ADMIN MANAGER - SOLO VISIBLE PARA ADMINS -->
                <a href="admin.html" class="sidebar-link" id="adminSidebarBtn" style="display:none;">
                    <span class="material-icons-outlined">admin_panel_settings</span>
                    <span>Admin Manager</span>
                </a>
                
                <div class="sidebar-divider"></div>
                <a href="#" class="sidebar-link logout" onclick="logoutUser()">
                    <span class="material-icons-outlined">logout</span>
                    <span>Cerrar Sesión</span>
                </a>
            </nav>
        </aside>
        
        <main class="dashboard-main">
            <div class="section-header">
                <h2>Mi Perfil</h2>
            </div>
            
            <div class="profile-container">
                <div class="profile-card">
                    <div class="profile-avatar">
                        <span class="material-icons-outlined" style="font-size:80px;color:#f0b90b;">account_circle</span>
                        <button class="btn-secondary" onclick="changeAvatar()">Cambiar Avatar</button>
                    </div>
                    <div class="profile-info">
                        <div class="info-group">
                            <label>Nombre de Usuario</label>
                            <p id="profileUsername">-</p>
                        </div>
                        <div class="info-group">
                            <label>Correo Electrónico</label>
                            <p id="profileEmail">-</p>
                        </div>
                        <div class="info-group">
                            <label>Saldo Disponible</label>
                            <p id="profileBalance">$0.00</p>
                        </div>
                        <div class="info-group">
                            <label>Miembro desde</label>
                            <p id="profileSince">-</p>
                        </div>
                        <div class="info-group">
                            <label>Tarjetas Compradas</label>
                            <p id="profilePurchases">0</p>
                        </div>
                        
                        <!-- INSIGNIAS -->
                        <div class="profile-insignias-container">
                            <label>Insignias</label>
                            <div id="profileInsignias" class="user-insignias"></div>
                        </div>
                        
                        <!-- HERRAMIENTAS DE ADMIN -->
                        <div id="adminToolsContainer" class="admin-tools-container">
                            <div class="btn-group">
                                <button class="btn-primary" onclick="window.location.href='admin.html'">
                                    <span class="material-icons">admin_panel_settings</span>
                                    Panel Admin
                                </button>
                                <button class="btn-secondary" onclick="manageInsignias()">
                                    <span class="material-icons">stars</span>
                                    Gestionar Insignias
                                </button>
                                <button class="btn-secondary" onclick="manageUsers()">
                                    <span class="material-icons">people</span>
                                    Gestionar Usuarios
                                </button>
                            </div>
                        </div>
                        
                        <button class="btn-primary" onclick="editProfile()">
                            <span class="material-icons">edit</span> Editar Perfil
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script>
        // ============================================
        // PROFILE.JS - CON INSIGNIAS Y ADMIN
        // ============================================

        document.addEventListener('DOMContentLoaded', function() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('yx_users') || '[]');
            const fullUser = users.find(u => u.id === user.id);
            
            if (fullUser) {
                document.getElementById('profileUsername').textContent = fullUser.username || '-';
                document.getElementById('profileEmail').textContent = fullUser.email || '-';
                document.getElementById('profileBalance').textContent = `$${(fullUser.balance || 0).toFixed(2)}`;
                document.getElementById('userBalance').textContent = `$${(fullUser.balance || 0).toFixed(2)}`;
                document.getElementById('profilePurchases').textContent = (fullUser.purchases || []).length;
                
                if (fullUser.createdAt) {
                    document.getElementById('profileSince').textContent = new Date(fullUser.createdAt).toLocaleDateString('es-ES', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                }
            }
            
            // Renderizar insignias
            renderProfileInsignias();
            renderInsignias(user.email, 'userInsignias');
            
            // ============ VERIFICAR SI ES ADMIN ============
            let isUserAdmin = false;
            try {
                const whitelistData = localStorage.getItem('admin_whitelist');
                if (whitelistData) {
                    const whitelist = JSON.parse(whitelistData);
                    if (whitelist.admins && whitelist.admins.includes(user.email)) {
                        isUserAdmin = true;
                    }
                }
            } catch (e) {}
            
            // Mostrar/ocultar herramientas de admin
            const adminTools = document.getElementById('adminToolsContainer');
            const adminBtn = document.getElementById('adminPanelBtn');
            const adminSidebarBtn = document.getElementById('adminSidebarBtn');
            
            if (isUserAdmin) {
                console.log('👑 Usuario ADMIN detectado en perfil:', user.email);
                if (adminTools) adminTools.style.display = 'block';
                if (adminBtn) adminBtn.style.display = 'flex';
                if (adminSidebarBtn) adminSidebarBtn.style.display = 'flex';
            } else {
                if (adminTools) adminTools.style.display = 'none';
                if (adminBtn) adminBtn.style.display = 'none';
                if (adminSidebarBtn) adminSidebarBtn.style.display = 'none';
            }
        });

        function renderProfileInsignias() {
            const user = getCurrentUser();
            if (!user) return;
            
            const container = document.getElementById('profileInsignias');
            if (!container) return;
            
            const insignias = getUserInsignias(user.email);
            const allInsignias = getAllInsignias();
            
            if (!insignias || insignias.length === 0) {
                container.innerHTML = `
                    <span class="insignia-guest">
                        <span class="material-icons" style="font-size:14px;">person_outline</span> Guest
                    </span>
                `;
                return;
            }
            
            container.innerHTML = insignias.map(name => {
                const ins = allInsignias[name];
                if (!ins) return '';
                return `
                    <span class="insignia-badge" style="background:${ins.bgColor || 'rgba(149,165,166,0.15)'}; color:${ins.color || '#95a5a6'};">
                        <span class="material-icons" style="font-size:16px;">${ins.icon || 'person_outline'}</span>
                        ${name}
                    </span>
                `;
            }).join('');
        }

        function manageInsignias() {
            const user = getCurrentUser();
            if (!user) return;
            
            // Verificar si es admin
            let isUserAdmin = false;
            try {
                const whitelistData = localStorage.getItem('admin_whitelist');
                if (whitelistData) {
                    const whitelist = JSON.parse(whitelistData);
                    if (whitelist.admins && whitelist.admins.includes(user.email)) {
                        isUserAdmin = true;
                    }
                }
            } catch (e) {}
            
            if (!isUserAdmin) {
                showToast('❌ No tienes permisos de administrador', 'error');
                return;
            }
            
            const email = prompt('📧 Ingresa el correo del usuario para gestionar insignias:');
            if (!email) return;
            
            const current = getUserInsignias(email);
            const allInsignias = getAllInsignias();
            const insigniaNames = Object.keys(allInsignias);
            
            let message = `👤 Usuario: ${email}\n`;
            message += `📛 Insignias actuales: ${current.join(', ') || 'Ninguna'}\n\n`;
            message += `📋 Insignias disponibles:\n`;
            insigniaNames.forEach((name, i) => {
                const ins = allInsignias[name];
                message += `  ${i+1}. ${name} - ${ins.description || ''}\n`;
            });
            message += `\n✏️ Escribe el nombre de la insignia para AÑADIR (ej: VIP)`;
            message += `\n🗑️ Escribe -NOMBRE para QUITAR (ej: -VIP)`;
            message += `\n📌 Escribe "lista" para ver las insignias de este usuario`;
            message += `\n❌ Escribe "cancelar" para salir`;
            
            const action = prompt(message);
            if (!action || action.toLowerCase() === 'cancelar') return;
            
            if (action.toLowerCase() === 'lista') {
                const currentIns = getUserInsignias(email);
                alert(`📛 Insignias de ${email}:\n${currentIns.join(', ') || 'Ninguna'}`);
                manageInsignias();
                return;
            }
            
            let result;
            if (action.startsWith('-')) {
                const name = action.substring(1).trim();
                result = removeInsigniaFromUser(email, name);
            } else {
                const name = action.trim();
                result = addInsigniaToUser(email, name);
            }
            
            showToast(result.message, result.success ? 'success' : 'error');
            renderProfileInsignias();
            renderInsignias(user.email, 'userInsignias');
        }

        function manageUsers() {
            const user = getCurrentUser();
            if (!user) return;
            
            // Verificar si es admin
            let isUserAdmin = false;
            try {
                const whitelistData = localStorage.getItem('admin_whitelist');
                if (whitelistData) {
                    const whitelist = JSON.parse(whitelistData);
                    if (whitelist.admins && whitelist.admins.includes(user.email)) {
                        isUserAdmin = true;
                    }
                }
            } catch (e) {}
            
            if (!isUserAdmin) {
                showToast('❌ No tienes permisos de administrador', 'error');
                return;
            }
            
            const users = getAllUsers();
            let message = '📋 LISTA DE USUARIOS\n\n';
            users.forEach((u, i) => {
                message += `${i+1}. ${u.username} - ${u.email}\n`;
                message += `   Saldo: $${(u.balance || 0).toFixed(2)}\n`;
                message += `   Tarjetas: ${(u.purchases || []).length}\n\n`;
            });
            
            const action = prompt(message + '\n✏️ Escribe el EMAIL del usuario para gestionar su saldo:\n❌ Escribe "cancelar" para salir');
            if (!action || action.toLowerCase() === 'cancelar') return;
            
            const targetEmail = action.trim();
            const targetUser = users.find(u => u.email === targetEmail);
            if (!targetUser) {
                showToast('❌ Usuario no encontrado', 'error');
                return;
            }
            
            const amount = prompt(`💰 Usuario: ${targetUser.username}\nSaldo actual: $${(targetUser.balance || 0).toFixed(2)}\n\nIngresa el monto a AÑADIR (positivo) o QUITAR (negativo):`);
            if (amount === null) return;
            
            const parsedAmount = parseFloat(amount);
            if (isNaN(parsedAmount)) {
                showToast('❌ Ingresa un número válido', 'error');
                return;
            }
            
            const concept = prompt('📝 Concepto de la transacción:', 'Ajuste manual por admin');
            if (concept === null) return;
            
            const result = updateUserBalanceByEmail(targetEmail, parsedAmount, concept || 'Ajuste manual');
            showToast(result.message, result.success ? 'success' : 'error');
        }

        function changeAvatar() {
            showToast('Función de avatar (próximamente)', 'info');
        }

        function editProfile() {
            showToast('Editar perfil (próximamente)', 'info');
        }
    </script>
</body>
</html>
