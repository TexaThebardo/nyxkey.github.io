<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .loading-container { text-align: center; padding: 40px; animation: fadeIn 0.6s ease-out; }
        .loading-logo { margin-bottom: 40px; }
        .loading-logo i { font-size: 4rem; background: linear-gradient(135deg, #4f46e5, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: pulse 2s ease-in-out infinite; }
        .loading-logo h1 { color: white; font-size: 1.8rem; font-weight: 800; margin-top: 10px; background: linear-gradient(135deg, #4f46e5, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .spinner-container { position: relative; width: 80px; height: 80px; margin: 0 auto 30px; }
        .spinner-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 3px solid transparent; border-top-color: #4f46e5; animation: spin 1s linear infinite; }
        .spinner-ring:nth-child(2) { width: 70%; height: 70%; top: 15%; left: 15%; border-top-color: #7c3aed; animation-duration: 1.5s; animation-direction: reverse; }
        .spinner-ring:nth-child(3) { width: 40%; height: 40%; top: 30%; left: 30%; border-top-color: #818cf8; animation-duration: 2s; }
        .spinner-dot { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; background: linear-gradient(135deg, #4f46e5, #7c3aed); border-radius: 50%; animation: dotPulse 1.5s ease-in-out infinite; }
        .progress-container { width: 280px; max-width: 80%; margin: 0 auto 25px; }
        .progress-track { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; position: relative; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4f46e5, #7c3aed, #818cf8); border-radius: 4px; animation: progress 2.5s ease-in-out infinite; }
        .loading-text { color: #a0aec0; font-size: 0.95rem; font-weight: 500; margin-top: 10px; }
        .loading-percentage { color: #4f46e5; font-size: 0.8rem; font-weight: 600; margin-top: 8px; letter-spacing: 1px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } }
        @keyframes dotPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.3); } }
        @keyframes progress { 0% { width: 0%; } 20% { width: 20%; } 40% { width: 45%; } 60% { width: 65%; } 80% { width: 85%; } 100% { width: 100%; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            .loading-logo i { font-size: 3rem; }
            .loading-logo h1 { font-size: 1.4rem; }
            .spinner-container { width: 60px; height: 60px; }
            .progress-container { width: 200px; }
            .loading-text { font-size: 0.85rem; }
        }
        @media (max-width: 480px) {
            .loading-logo i { font-size: 2.5rem; }
            .loading-logo h1 { font-size: 1.2rem; }
            .spinner-container { width: 50px; height: 50px; }
            .progress-container { width: 160px; }
            .spinner-dot { width: 8px; height: 8px; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loading-logo"><i class="fas fa-credit-card"></i><h1>CardNMR Store</h1></div>
        <div class="spinner-container">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-dot"></div>
        </div>
        <div class="progress-container"><div class="progress-track"><div class="progress-bar"></div></div></div>
        <p class="loading-text">Cargando<span>.</span></p>
        <p class="loading-percentage" id="percentage">0%</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const percentageEl = document.getElementById('percentage');
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 8 + 2;
                if (progress > 100) { progress = 100; clearInterval(interval); }
                percentageEl.textContent = Math.floor(progress) + '%';
            }, 300);
            setTimeout(() => {
                const url = sessionStorage.getItem('redirectUrl') || 'index.html';
                window.location.href = url;
            }, 2500);
        });
    </script>
</body>
</html>
