<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Yx Cards</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .admin-header {
            background: #131a22;
            border: 1px solid #2a313c;
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .admin-header h1 { font-size: 24px; font-weight: 700; color: #e8edf2; display: flex; align-items: center; gap: 12px; }
        .admin-header h1 .material-icons-outlined { color: #f0b90b; font-size: 32px; }
        .admin-badge { background: #f0b90b; color: #0b0e14; padding: 4px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .admin-panel { background: #131a22; border: 1px solid #2a313c; border-radius: 16px; padding: 24px; margin-bottom: 24px; }
        .admin-panel h2 { font-size: 18px; font-weight: 600; color: #e8edf2; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .admin-panel h2 .material-icons-outlined { color: #f0b90b; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-group label { font-size: 14px; font-weight: 500; color: #a0aab8; display: flex; align-items: center; gap: 8px; }
        .form-group input { background: #0b0e14; border: 1px solid #2a313c; border-radius: 10px; padding: 12px 16px; color: #e8edf2; font-size: 14px; font-family: 'Inter', sans-serif; transition: all 0.3s ease; width: 100%; }
        .form-group input:focus { outline: none; border-color: #f0b90b; box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.1); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
        .btn-admin { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.3s ease; border: none; font-family: 'Inter', sans-serif; width: 100%; }
        .btn-admin-primary { background: #f0b90b; color: #0b0e14; }
        .btn-admin-primary:hover { background: #d4a40a; transform: scale(1.02); }
        .btn-admin-success { background: #2ecc71; color: #0b0e14; }
        .btn-admin-success:hover { background: #27ae60; transform: scale(1.02); }
        .btn-admin-secondary { background: #1a232e; color: #a0aab8; border: 1px solid #2a313c; }
        .btn-admin-secondary:hover { background: #1e2a38; color: #e8edf2; }
        .users-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .users-table th { text-align: left; padding: 12px 16px; background: #1a232e; color: #a0aab8; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #2a313c; }
        .users-table td { padding: 10px 16px; border-bottom: 1px solid #1e2630; color: #e8edf2; }
        .users-table tr:hover td { background: #1e2a38; }
        .users-table .user-email { color: #f0b90b; font-weight: 500; }
        .users-table .user-balance { font-weight: 700; color: #2ecc71; }
        .table-responsive { overflow-x: auto; }
        .admin-login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .admin-login-box { background: #131a22; border: 1px solid #2a313c; border-radius: 16px; padding: 40px; max-width: 400px; width: 100%; }
        .admin-login-box h2 { color: #e8edf2; font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; }
        .admin-login-box p { color: #a0aab8; text-align: center; margin-bottom: 24px; }
        .admin-login-box .admin-hint { font-size: 12px; color: #5a6575; text-align: center; margin-top: 12px; }
        .admin-login-box .input-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
        .admin-login-box .input-group label { font-size: 13px; font-weight: 500; color: #a0aab8; display: flex; align-items: center; gap: 8px; }
        .admin-login-box .input-group label .material-icons-outlined { font-size: 18px; color: #f0b90b; }
        .admin-login-box .input-group input { background: #0b0e14; border: 1px solid #2a313c; border-radius: 10px; padding: 12px 16px; color: #e8edf2; font-size: 14px; font-family: 'Inter', sans-serif; transition: all 0.3s ease; width: 100%; }
        .admin-login-box .input-group input:focus { outline: none; border-color: #f0b90b; box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.1); }
        .hidden { display: none !important; }
        .admin-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .admin-actions .btn-sm { padding: 4px 12px; font-size: 12px; border-radius: 20px; border: none; cursor: pointer; font-weight: 600; transition: all 0.3s ease; font-family: 'Inter', sans-serif; }
        .btn-sm-add { background: #2ecc71; color: #0b0e14; }
        .btn-sm-add:hover { background: #27ae60; }
        .btn-sm-view { background: #3498db; color: white; }
        .btn-sm-view:hover { background: #2980b9; }
        .toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; max-width: 90%; }
        .admin-logout-btn { background: #e74c3c; color: white; border: none; padding: 8px 20px; border-radius: 30px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; }
        .admin-logout-btn:hover { background: #c0392b; transform: scale(1.05); }
    </style>
</head>
<body>
    <!-- LOGIN ADMIN -->
    <div class="admin-login-overlay" id="adminLoginOverlay">
        <div class="admin-login-box">
            <div style="text-align:center;margin-bottom:16px;">
                <span class="material-icons-outlined" style="font-size:48px;color:#f0b90b;">admin_panel_settings</span>
                <h2>Panel de Administración</h2>
                <p>Acceso restringido para administradores</p>
            </div>
            <form id="adminLoginForm">
                <div class="input-group">
                    <label><span class="material-icons-outlined">email</span> Correo Administrador</label>
                    <input type="email" id="adminEmail" placeholder="admin@yxcards.com" required>
                </div>
                <div class="input-group">
                    <label><span class="material-icons-outlined">key</span> Clave de Acceso</label>
                    <input type="password" id="adminKey" placeholder="Ingresa tu clave" required>
                </div>
                <button type="submit" class="btn-admin btn-admin-primary">
                    <span class="material-icons">login</span> Acceder
                </button>
            </form>
            <div class="admin-hint">
                ⚠️ Solo administradores autorizados con clave pueden ingresar
            </div>
        </div>
    </div>

    <!-- PANEL ADMIN -->
    <div id="adminPanel" class="admin-container hidden">
        <div class="admin-header">
            <h1>
                <span class="material-icons-outlined">admin_panel_settings</span>
                Panel de Administración
                <span class="admin-badge">ADMIN</span>
            </h1>
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
                <button class="admin-logout-btn" onclick="logoutAdmin()">
                    <span class="material-icons">logout</span> Cerrar Sesión
                </button>
                <button class="btn-admin btn-admin-secondary" onclick="window.location.href='index.html'">
                    <span class="material-icons-outlined">home</span> Tienda
                </button>
            </div>
        </div>

        <!-- AGREGAR SALDO -->
        <div class="admin-panel">
            <h2><span class="material-icons-outlined">add_circle</span> Agregar Saldo</h2>
            <form id="addBalanceForm">
                <div class="form-row">
                    <div class="form-group">
                        <label><span class="material-icons-outlined">email</span> Correo del Usuario</label>
                        <input type="email" id="targetUserEmail" placeholder="usuario@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label><span class="material-icons-outlined">attach_money</span> Monto</label>
                        <input type="number" id="amountToAdd" placeholder="0.00" min="1" step="0.01" required>
                    </div>
                </div>
                <div class="form-group">
                    <label><span class="material-icons-outlined">description</span> Concepto</label>
                    <input type="text" id="transactionConcept" placeholder="Ej: Depósito por promoción">
                </div>
                <button type="submit" class="btn-admin btn-admin-success">
                    <span class="material-icons">paid</span> Agregar Saldo
                </button>
            </form>
        </div>

        <!-- LISTA DE USUARIOS -->
        <div class="admin-panel">
            <h2><span class="material-icons-outlined">people</span> Usuarios Registrados</h2>
            <div class="table-responsive">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Correo</th>
                            <th>Saldo</th>
                            <th>Tarjetas</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script>
        // ============================================
        // ADMIN - SCRIPT COMPLETO
        // ============================================

        // LOGIN CON EMAIL + KEY
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const key = document.getElementById('adminKey').value.trim();

            if (verifyAdminKey(email, key)) {
                localStorage.setItem('admin_session', JSON.stringify({ email: email, loggedIn: true, timestamp: Date.now() }));
                showAdminPanel();
                showToast('✅ Bienvenido Administrador', 'success');
            } else {
                showToast('❌ Credenciales incorrectas', 'error');
            }
        });

        function checkAdminSession() {
            const session = localStorage.getItem('admin_session');
            if (session) {
                try {
                    const data = JSON.parse(session);
                    if (data.loggedIn && (Date.now() - data.timestamp < 3600000)) {
                        if (isAdmin(data.email)) {
                            showAdminPanel();
                            return true;
                        } else {
                            localStorage.removeItem('admin_session');
                        }
                    }
                } catch (e) {}
            }
            return false;
        }

        function showAdminPanel() {
            document.getElementById('adminLoginOverlay').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadAdminData();
        }

        function logoutAdmin() {
            localStorage.removeItem('admin_session');
            document.getElementById('adminLoginOverlay').classList.remove('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            showToast('Sesión de administrador cerrada', 'info');
        }

        function loadAdminData() {
            const users = getUsers();
            const totalBalance = users.reduce((sum, u) => sum + (u.balance || 0), 0);

            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('totalBalance').textContent = `$${totalBalance.toFixed(2)}`;

            renderUsersTable(users);
        }

        function renderUsersTable(users) {
            const tbody = document.getElementById('usersTableBody');

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:30px;color:#5a6575;">No hay usuarios registrados</td></tr>`;
                return;
            }

            tbody.innerHTML = users.map(u => `
                <tr>
                    <td><strong>${u.username || 'N/A'}</strong></td>
                    <td class="user-email">${u.email}</td>
                    <td class="user-balance">$${(u.balance || 0).toFixed(2)}</td>
                    <td>${(u.purchases || []).length}</td>
                    <td>
                        <div class="admin-actions">
                            <button class="btn-sm btn-sm-add" onclick="quickAddBalance('${u.email}')">
                                <span class="material-icons" style="font-size:14px;">add</span>
                            </button>
                            <button class="btn-sm btn-sm-view" onclick="viewUserDetails('${u.email}')">
                                <span class="material-icons" style="font-size:14px;">visibility</span>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // AGREGAR SALDO
        document.getElementById('addBalanceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('targetUserEmail').value.trim();
            const amount = parseFloat(document.getElementById('amountToAdd').value);
            const concept = document.getElementById('transactionConcept').value.trim() || 'Depósito por administrador';

            if (!email || !amount || amount <= 0) {
                showToast('❌ Ingresa datos válidos', 'error');
                return;
            }

            const result = updateUserBalanceByEmail(email, amount, concept);
            if (result.success) {
                loadAdminData();
                document.getElementById('targetUserEmail').value = '';
                document.getElementById('amountToAdd').value = '';
                document.getElementById('transactionConcept').value = '';
                showToast(result.message, 'success');
            } else {
                showToast(result.message, 'error');
            }
        });

        function quickAddBalance(email) {
            const amount = prompt(`¿Cuánto saldo quieres agregar a ${email}?`, '10');
            if (amount === null) return;
            const parsedAmount = parseFloat(amount);
            if (isNaN(parsedAmount) || parsedAmount <= 0) {
                showToast('❌ Ingresa un monto válido', 'error');
                return;
            }
            const result = updateUserBalanceByEmail(email, parsedAmount, 'Depósito rápido por admin');
            if (result.success) {
                loadAdminData();
                showToast(result.message, 'success');
            } else {
                showToast(result.message, 'error');
            }
        }

        function viewUserDetails(email) {
            const users = getUsers();
            const user = users.find(u => u.email === email);
            if (!user) {
                showToast('❌ Usuario no encontrado', 'error');
                return;
            }

            const purchases = user.purchases || [];
            let details = `📊 DETALLES DE USUARIO\n\n`;
            details += `👤 Usuario: ${user.username}\n`;
            details += `📧 Email: ${user.email}\n`;
            details += `💰 Saldo: $${(user.balance || 0).toFixed(2)}\n`;
            details += `🃏 Tarjetas: ${purchases.length}\n`;
            details += `📅 Miembro desde: ${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'N/A'}\n\n`;

            if (purchases.length > 0) {
                details += `🃏 TARJETAS COMPRADAS:\n`;
                purchases.forEach((p, i) => {
                    details += `  ${i+1}. ${p.network || 'N/A'} ${p.bin || '****'} - $${((p.price || 0) * (p.quantity || 1)).toFixed(2)}\n`;
                });
            } else {
                details += `🃏 No ha comprado tarjetas aún.\n`;
            }
            alert(details);
        }

        function showToast(message, type = 'info') {
            let container = document.querySelector('.toast-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            const colors = { success: '#2ecc71', error: '#e74c3c', info: '#3498db', warning: '#f39c12' };
            toast.style.cssText = `background:#1a232e;color:#e8edf2;padding:12px 24px;border-radius:12px;border-left:4px solid ${colors[type] || colors.info};box-shadow:0 8px 32px rgba(0,0,0,0.5);font-size:14px;font-weight:500;pointer-events:auto;animation:slideUp 0.3s ease;min-width:200px;text-align:center;border:1px solid #2a313c;`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'slideDown 0.3s ease'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        if (!checkAdminSession()) {
            document.getElementById('adminLoginOverlay').classList.remove('hidden');
        }

        const styleSheet = document.createElement("style");
        styleSheet.textContent = `@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } } @keyframes slideDown { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(20px); } }`;
        document.head.appendChild(styleSheet);
    </script>
</body>
</html>
