<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - CardNMR Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html">
                    <i class="fas fa-credit-card"></i>
                    CardNMR Store
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="shop.html">Tienda</a>
                <a href="admin.html" class="active">Admin</a>
                <a href="#" id="logoutBtn">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <section class="admin-panel">
        <div class="container">
            <div class="admin-header">
                <h1>🔧 Panel de Administración</h1>
                <p>Administra tus productos desde GitHub</p>
            </div>

            <!-- 📝 INSTRUCCIONES PARA GITHUB -->
            <div class="github-instructions">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    <div>
                        <strong>📝 ¿Cómo actualizar tu tienda?</strong>
                        <p>Edita directamente el archivo <code>data/products.json</code> en GitHub</p>
                        <a href="https://github.com/tu-usuario/card-nmr-store/edit/main/data/products.json" target="_blank" class="btn-github">
                            <i class="fab fa-github"></i> Editar en GitHub
                        </a>
                    </div>
                </div>
            </div>

            <!-- FORMULARIO AGREGAR PRODUCTO -->
            <div class="admin-form-container">
                <h2>➕ Agregar Nuevo Producto</h2>
                <form id="addProductForm" class="admin-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre</label>
                            <input type="text" name="name" placeholder="Ej: Visa Gold Premium" required>
                        </div>
                        <div class="form-group">
                            <label>Precio ($)</label>
                            <input type="number" name="price" step="0.01" placeholder="149.99" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea name="description" rows="3" placeholder="Descripción del producto" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo de Tarjeta</label>
                            <select name="cardType">
                                <option value="Visa">Visa</option>
                                <option value="Mastercard">Mastercard</option>
                                <option value="Amex">American Express</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Categoría</label>
                            <select name="category">
                                <option value="premium">Premium</option>
                                <option value="elite">Elite</option>
                                <option value="standard">Standard</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Número de Tarjeta</label>
                            <input type="text" name="cardNumber" placeholder="4532 1234 5678 9012" required>
                        </div>
                        <div class="form-group">
                            <label>Fecha Expiración</label>
                            <input type="text" name="cardExpiry" placeholder="MM/YY" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Stock</label>
                            <input type="number" name="stock" value="1" required>
                        </div>
                        <div class="form-group">
                            <label>Imagen URL</label>
                            <input type="text" name="image" placeholder="images/cards/tarjeta.jpg">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Características (separadas por coma)</label>
                        <input type="text" name="features" placeholder="Límite $10,000, Compras internacionales">
                    </div>

                    <button type="submit" class="btn-primary">
                        <i class="fas fa-plus"></i> Agregar Producto
                    </button>
                </form>
            </div>

            <!-- LISTA DE PRODUCTOS -->
            <div class="admin-products">
                <div class="admin-products-header">
                    <h2>📦 Productos Actuales</h2>
                    <div class="admin-actions">
                        <button onclick="exportToJSON()" class="btn-export">
                            <i class="fas fa-download"></i> Exportar JSON
                        </button>
                        <button onclick="copyToClipboard()" class="btn-copy">
                            <i class="fas fa-copy"></i> Copiar JSON
                        </button>
                    </div>
                </div>
                <div id="adminProductsList">
                    <!-- Los productos se renderizan desde JS -->
                </div>
            </div>
        </div>
    </section>

    <script src="js/app.js"></script>
    <script src="js/products.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
